[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Production-grade RAG platform with hybrid search and RBAC"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.6",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.1",
    "psycopg[binary]==3.20.1",
    "qdrant-client==1.14.0",
    "minio==7.2.10",
    "redis==5.4.1",
    "opentelemetry-api==1.28.0",
    "opentelemetry-sdk==1.28.0",
    "opentelemetry-exporter-jaeger-thrift==1.28.0",
    "opentelemetry-instrumentation-fastapi==0.49b3",
    "opentelemetry-instrumentation-redis==0.49b3",
    "opentelemetry-instrumentation-sqlalchemy==0.49b3",
    "rank-bm25==0.2.2",
    "numpy==1.26.4",
    "pdfplumber==0.11.2",
    "requests==2.32.3",
    "python-multipart==0.0.7",
    "python-jose[cryptography]==3.3.0",
    "sentence-transformers==3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.8.4",
    "black==24.10.0",
    "mypy==1.14.1",
    "httpx==0.28.1",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
